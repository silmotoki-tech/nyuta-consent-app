<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: #FBF8F2;
      color: #24333F;
      box-sizing: border-box;
      padding: 72px 96px;
    }
    .kicker { color: #3F6B2C; font-size: 28px; letter-spacing: 0.12em; margin-bottom: 16px; }
    h1 { font-size: 64px; font-weight: 600; color: #3F6B2C; margin: 0 0 48px; }
    ul { margin: 0; padding: 0; list-style: none; }
    li {
      font-size: 36px;
      line-height: 1.7;
      padding: 16px 0 16px 28px;
      border-bottom: 1px solid #E4E0D4;
    }
  </style>
</head>
<body>
  <div class="kicker">一般手術注意事項 3 / 3</div>
  <h1>予防とその他注意事項について</h1>
  <ul>
    <li>1か月以内のノミ・ダニ予防と、1年以内のワクチン接種が必要です。</li>
    <li>予防がない場合は、隔離お預かりの料金が発生します。</li>
    <li>手術部位の毛刈りが必要になります。</li>
    <li>当日キャンセルの場合は、予約変更手数料として3,000円がかかります。</li>
  </ul>
</body>
</html>
