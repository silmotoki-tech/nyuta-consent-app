<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: #FBF8F2;
      color: #24333F;
      box-sizing: border-box;
      padding: 72px 96px;
    }
    .kicker { color: #3F6B2C; font-size: 28px; letter-spacing: 0.12em; margin-bottom: 16px; }
    h1 { font-size: 64px; font-weight: 600; color: #3F6B2C; margin: 0 0 48px; }
    ul { margin: 0; padding: 0; list-style: none; }
    li {
      font-size: 40px;
      line-height: 1.7;
      padding: 18px 0 18px 28px;
      border-bottom: 1px solid #E4E0D4;
    }
    .note { margin-top: 48px; font-size: 28px; color: #6b4834; }
  </style>
</head>
<body>
  <div class="kicker">一般手術注意事項 1 / 3</div>
  <h1>当日ご持参いただくもの・お願い</h1>
  <ul>
    <li>普段食べているフードを、指定の回分ご持参ください。</li>
    <li>可能であれば、排便・排尿をしてからご来院ください。</li>
    <li>お時間に余裕をもってお越しください。</li>
  </ul>
  <p class="note">混雑や診察状況により、当日お預かりに時間がかかることがあります。</p>
</body>
</html>
