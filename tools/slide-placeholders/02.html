<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: #FBF8F2;
      color: #24333F;
      box-sizing: border-box;
      padding: 72px 96px;
    }
    .kicker { color: #3F6B2C; font-size: 28px; letter-spacing: 0.12em; margin-bottom: 16px; }
    h1 { font-size: 64px; font-weight: 600; color: #3F6B2C; margin: 0 0 48px; }
    .lead { font-size: 42px; line-height: 1.7; margin: 0 0 36px; }
    .reason {
      font-size: 36px;
      line-height: 1.7;
      color: #6b4834;
      background: #EFF3E8;
      border-radius: 16px;
      padding: 28px 36px;
    }
  </style>
</head>
<body>
  <div class="kicker">一般手術注意事項 2 / 3</div>
  <h1>前日夜からの注意事項</h1>
  <p class="lead">前日の22時以降は、食事（水以外）をとらないでご来院ください。水はご来院前まで飲んでも大丈夫です。</p>
  <p class="reason">食べたものを吐いてしまうと危険なため、絶食の指示は必ず守ってください。</p>
</body>
</html>
